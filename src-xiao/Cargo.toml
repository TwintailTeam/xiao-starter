[package]
name = "xiao-app"
version = "0.1.0"
description = "A xiao app"
license = "MIT-0"
edition = "2024"

[lib]
name = "xiao_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
xiao-build = { git = "https://github.com/TwintailTeam/xiao" }

[dependencies]
xiao = { git = "https://github.com/TwintailTeam/xiao" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
